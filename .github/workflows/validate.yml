name: Validate Jekyll
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary Markdown fixture
        run: |
          cat > _posts/2000-01-01-jekyll-check.md <<'POST'
          ---
          title: "Markdown conversion check"
          category: 개발
          ---
          ## Markdown heading check

          **Bold check**

          ```python
          print("hello")
          ```

          | Name | Value |
          | --- | --- |
          | check | passed |
          POST
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check generated site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('_site')
          home = (root / 'index.html').read_text()
          post = (root / 'posts/2000/01/01/jekyll-check/index.html').read_text()
          assert 'Markdown conversion check' in home
          assert '/posts/2000/01/01/jekyll-check/' in home
          assert 'data-post-categories="[&quot;개발&quot;]"' in home
          assert '<strong>Bold check</strong>' in post
          assert '<table>' in post
          assert 'language-python' in post
          assert '<h2' in post and 'Markdown heading check' in post
          assert 'href="/style.css?v=' in post
          assert 'src="/app.js?v=' in post
          assert '<title>Markdown conversion check · 0chae.exe</title>' in post
          import json
          catalog = json.loads((root / 'posts.json').read_text())
          assert any(item['id'] == '/posts/2000/01/01/jekyll-check/' for item in catalog['posts'])
          assert 'id="post-interactions"' in post
          assert 'data-post-id="/posts/2000/01/01/jekyll-check/"' in post
          assert 'src="/post-interactions.js?v=' in post
          assert (root / 'post-interactions.js').is_file()
          assert 'id="post-interactions"' not in home
          assert not re.search(r'{[{%]', home + post)
          print('Markdown, post layout, category metadata, URLs and assets passed.')
          PY
