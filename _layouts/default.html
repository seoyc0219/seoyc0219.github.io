<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6efe5"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title><link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="stylesheet" href="{{ '/style.css' | relative_url }}"></head>
<body{% if page.layout == 'post' %} class="post-page"{% endif %}>
<header><a class="brand" href="{{ '/' | relative_url }}" aria-label="seoyc0219 홈">{{ site.title | escape }}<span aria-hidden="true">✳</span></a><nav aria-label="주 메뉴"><a href="{{ '/' | relative_url }}#journal">기록</a><a href="https://github.com/seoyc0219" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></header>
<main>{{ content }}</main>
<footer><a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span aria-hidden="true">✳</span></a><span>조금씩, 나의 속도로.</span><a href="#" aria-label="페이지 맨 위로">위로 ↑</a></footer><script src="{{ '/app.js' | relative_url }}" defer></script></body></html>
